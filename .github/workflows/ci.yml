name: Core examples CLI and interoperability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked MoonBit for public signature consumption
        run: |
          python scripts/install_toolchain.py
          echo "MOON_HOME=$PWD/.toolchain/selected" >> "$GITHUB_ENV"
          echo "$PWD/.toolchain/selected/bin" >> "$GITHUB_PATH"
      - name: Install reference build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libpopt-dev
      - name: Build from fixed source, rebuild and reject corruption
        run: bash scripts/rebuild-reference.sh
      - name: Compare public signatures and verify upstream consumption
        run: python scripts/consume_signature.py
      - name: Consume MoonBit deltas with pinned upstream patch
        run: python scripts/consume_delta.py
      - name: Bidirectional rdiff interoperability and deterministic regression
        timeout-minutes: 10
        run: bash scripts/interop.sh
      - name: Stage A public API combinations with fixed rdiff
        run: python scripts/check_stage_a.py
      - name: Preserve independent stage A combination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-a-${{ github.sha }}
          path: _build/stage-a/
          if-no-files-found: error
      - name: Explicit auto block signatures and finite data volume comparison
        run: python scripts/check_auto_block.py
      - name: Preserve auto block evidence separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-block-${{ github.sha }}
          path: _build/auto-block/
          if-no-files-found: error
      - name: Commit 26 payload decisions and pinned upstream recovery
        run: python scripts/check_transfer.py
      - name: Preserve separate transfer reference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transfer-${{ github.sha }}
          path: _build/commit26/reference/
          if-no-files-found: error
      - name: Stage B finite combinations and rejection checks
        run: python scripts/check_stage_b.py
      - name: Preserve stage B combination evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-b-${{ github.sha }}
          path: _build/stage-b/
          if-no-files-found: error
      - name: Benchmark generator and statistics correctness (no timed performance gate)
        run: python scripts/benchmark.py --self-check
      - name: Prepared benchmark tool correctness and pinned upstream reuse recovery
        run: |
          python scripts/benchmark_prepared.py --self-check
          python scripts/benchmark_prepared.py --interop-only
      - name: Preserve separate prepared interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ github.sha }}
          path: |
            _build/benchmarks-prepared/interop-check/manifest.json
            _build/benchmarks-prepared/interop-check/interop-report.json
            _build/benchmarks-prepared/interop-check/commands.log
          if-no-files-found: error
      - name: Linux Native product CLI and pinned rdiff file exchange
        run: python scripts/file_exchange.py
      - name: Preserve Linux file exchange evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exchange-${{ github.sha }}
          path: _build/exchange/
          if-no-files-found: error
      - name: Preserve same-SHA interoperability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interop-${{ github.sha }}
          path: _build/interop/
          if-no-files-found: error
  foundations:
    name: ${{ matrix.os }} / fixed toolchain
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Install hash-locked MoonBit and matching core
        run: python scripts/install_toolchain.py
      - name: Select isolated toolchain
        shell: pwsh
        run: |
          "MOON_HOME=$PWD/.toolchain/selected" >> $env:GITHUB_ENV
          "$PWD/.toolchain/selected/bin" >> $env:GITHUB_PATH
      - name: Format, interfaces, dependencies, three targets and probes
        run: python scripts/check.py
      - name: Release archive safety tools (separate count)
        run: python -m unittest discover -s tests/release -p 'test_*.py'
      - name: Release 0.3.0 archive, clean rebuild and all public consumers
        env:
          MOONLIBSYNC_RELEASE_DIR: _build/release-0.3.0/${{ matrix.os }}
          PYTHONUTF8: "0"
          PYTHONIOENCODING: utf-8
        run: python scripts/release_check.py --clean
      - name: Preserve candidate package acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ matrix.os }}-${{ github.sha }}
          path: _build/release-0.3.0/${{ matrix.os }}/
          if-no-files-found: error
      - name: Isolated corrupt fixtures and false example expectation
        run: python scripts/failure_gates.py
      - name: Preserve examples interfaces and failure propagation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gates-examples-${{ matrix.os }}-${{ github.sha }}
          path: |
            _build/examples/
            _build/interfaces/
            _build/prepared-encapsulation/
            _build/gates/
          if-no-files-found: error
      - name: PowerShell external-process exit handling
        shell: pwsh
        run: ./scripts/native_probe.ps1
      - name: Windows Native CLI file smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/cli-smoke.ps1
      - name: Linux Native CLI file smoke
        if: runner.os == 'Linux'
        run: bash scripts/cli-smoke.sh
      - name: Preserve Native CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}-${{ github.sha }}
          path: _build/cli/
          if-no-files-found: error
      - name: Reject tracked interface changes
        run: git diff --exit-code -- '*.mbti'
      - name: Preserve per-target resource audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resources-${{ matrix.os }}-${{ github.sha }}
          path: _build/resources/
          if-no-files-found: error
