name: Release Native CLI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v0.3.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: moonlibsync-linux-x86_64
          - os: windows-latest
            asset: moonlibsync-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked MoonBit toolchain
        run: python scripts/install_toolchain.py
      - name: Select isolated toolchain
        shell: pwsh
        run: |
          "MOON_HOME=$PWD/.toolchain/selected" >> $env:GITHUB_ENV
          "$PWD/.toolchain/selected/bin" >> $env:GITHUB_PATH
      - name: Fetch locked dependencies and verify integrity
        run: |
          moon update
          moon check --target wasm-gc --no-mbti
          python scripts/verify_dependencies.py
      - name: Build release Native CLI
        run: moon build cmd/moonlibsync --target native --release
      - name: Verify binary and stage release asset
        shell: pwsh
        run: |
          $built = "_build/native/release/build/cmd/moonlibsync/moonlibsync.exe"
          if (-not (Test-Path $built)) { throw "Missing built CLI artifact: $built" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $dest = "dist/${{ matrix.asset }}"
          Copy-Item -Path $built -Destination $dest -Force
          if ($IsLinux) { chmod +x $dest }
          $ver = & "./$dest" --version
          if ($LASTEXITCODE -ne 0) { throw "CLI --version failed" }
          Write-Host "Verified artifact: $dest -> $ver"
      - name: Upload built asset
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download built CLI assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          chmod +x moonlibsync-linux-x86_64
          sha256sum moonlibsync-linux-x86_64 moonlibsync-windows-x86_64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Generate Release notes from CHANGELOG
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          tag = os.environ['TAG'].strip()
          ver = tag[1:] if tag.startswith('v') else tag
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = re.compile(rf'^## \[{re.escape(ver)}\][^\n]*\n(.*?)(?=^## \[|\Z)', re.M | re.S)
          m = pattern.search(changelog)
          sums = Path('dist/SHA256SUMS.txt').read_text(encoding='utf-8').strip()
          parts = []
          if m:
              parts.append(m.group(1).strip())
          else:
              parts.append(f'Release `{tag}` of MoonLibSync.')
          parts.append(
              '### Native CLI Assets & SHA-256 Checksums\n\n'
              '```text\n' + sums + '\n```\n\n'
              '- Linux x86_64: `chmod +x moonlibsync-linux-x86_64 && ./moonlibsync-linux-x86_64 --version`\n'
              '- Windows x86_64: `.\\moonlibsync-windows-x86_64.exe --version`\n'
              f'- Docs: https://mooncakes.io/docs/YKDshaxing/moonlibsync@{ver} · Web Studio: https://ykdshaxing.github.io/moonlibsync/'
          )
          Path('RELEASE_NOTES.md').write_text('\n\n'.join(parts) + '\n', encoding='utf-8')
          PY
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "MoonLibSync ${TAG}" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" dist/* \
              --title "MoonLibSync ${TAG}" \
              --notes-file RELEASE_NOTES.md
          fi
